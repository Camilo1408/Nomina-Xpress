name: DB Migration (Turso)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribir 'si' para confirmar la migración en producción"
        required: true
        default: ""

jobs:
  migrate:
    name: Aplicar migraciones a Turso
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'si' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Aplicar migraciones via LibSQL
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node prisma/run-migrations.mjs
