name: DB Migration Script (Turso, un cliente)

# Ejecuta UN script idempotente prisma/turso-migrate-*.mjs contra UN cliente de
# DB_TARGETS. Es el patrón de DESPLIEGUES.md ("Cambios de esquema") sin sacar los
# tokens de GitHub. No usa prisma/run-migrations.mjs: ese historial está
# desincronizado (ver CLAUDE.md). Lanzar el backup-db.yml antes.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "name exacto del cliente en DB_TARGETS (p.ej. demo, cucina-fiori). No admite 'all'."
        required: true
      script:
        description: "Nombre del script, p.ej. turso-migrate-concursos.mjs"
        required: true
      confirm:
        description: "Escribe 'si' para confirmar la migración en producción"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  migrate:
    name: Migrar ${{ github.event.inputs.target }} con ${{ github.event.inputs.script }}
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'si' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Ejecutar el script contra el cliente
        env:
          DB_TARGETS: ${{ secrets.DB_TARGETS }}
          TARGET: ${{ github.event.inputs.target }}
          SCRIPT: ${{ github.event.inputs.script }}
        run: |
          set -euo pipefail
          if ! [[ "$SCRIPT" =~ ^turso-migrate-[a-z0-9-]+\.mjs$ ]] || [ ! -f "prisma/$SCRIPT" ]; then
            echo "::error::Script no válido: '$SCRIPT'. Debe ser prisma/turso-migrate-*.mjs y existir."
            exit 1
          fi
          ENTRY=$(echo "$DB_TARGETS" | jq -c --arg n "$TARGET" '[.[] | select(.name == $n)] | .[0] // empty')
          if [ -z "$ENTRY" ]; then
            echo "::error::El target '$TARGET' no coincide con ningún cliente en DB_TARGETS."
            exit 1
          fi
          URL=$(echo "$ENTRY" | jq -r '.url')
          TOKEN=$(echo "$ENTRY" | jq -r '.token')
          echo "::add-mask::$TOKEN"
          echo "== $SCRIPT sobre $TARGET =="
          TURSO_DATABASE_URL="$URL" TURSO_AUTH_TOKEN="$TOKEN" node "prisma/$SCRIPT"
